name: Build PS4 & PS5 Store

on:
  push:
    branches: [ master, main]
  pull_request:
    branches: [ master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        platform: [ps4, ps5]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld make

    - name: Setup OpenOrbis Toolchain
      run: |
        curl -sL https://github.com/LightningMods/OpenOrbis-PS4-Toolchain/releases/download/v0.50001/OOSDK.tar.gz \
          | tar -xz -C "$GITHUB_WORKSPACE"
        chmod +x "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/bin/linux/"*
        echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

    - name: Build Store-Loader
      run: |
        cd Store-Loader
        make clean
        make -j$(nproc) oelf eboot

    - name: Build Store (${{ matrix.platform }})
      run: |
        cd Store
        make clean
        if [ "${{ matrix.platform }}" = "ps5" ]; then
          make -j$(nproc) -f Makefile.ps5
          PLATFORM_SUFFIX="-PS5"
        else
          make -j$(nproc)
          PLATFORM_SUFFIX=""
        fi
        
        # PkgTool.Core names the output after content_id; rename for consistency
        pkg=$(ls *.pkg 2>/dev/null | head -1)
        if [ -n "$pkg" ] && [ "$pkg" != "Store-R2${PLATFORM_SUFFIX}.pkg" ]; then
          mv "$pkg" "Store-R2${PLATFORM_SUFFIX}.pkg"
        fi
        
        test -f "Store-R2${PLATFORM_SUFFIX}.pkg" || { echo "Error: Store-R2${PLATFORM_SUFFIX}.pkg was not created"; exit 1; }
        test -f homebrew.elf || { echo "Error: homebrew.elf was not created"; exit 1; }
        
        # Regenerate remote.md5 so CDN operators can detect this build as an update
        md5sum homebrew.elf | awk '{print $1}' > "remote${PLATFORM_SUFFIX}.md5"

    - name: Determine store version
      id: version
      run: |
        major=$(grep -oP '#define\s+VERSION_MAJOR\s+\K[0-9]+' Store/include/defines.h)
        minor=$(grep -oP '#define\s+VERSION_MINOR\s+\K[0-9]+' Store/include/defines.h)
        test -n "$major" || { echo "Error: could not determine VERSION_MAJOR"; exit 1; }
        test -n "$minor" || { echo "Error: could not determine VERSION_MINOR"; exit 1; }
        echo "tag=${major}.${minor}" >> "$GITHUB_OUTPUT"

    - name: Upload PKG artifact (${{ matrix.platform }})
      uses: actions/upload-artifact@v4
      with:
        name: PS4-Store-${{ matrix.platform }}-PKG
        path: |
          Store/Store-R2*.pkg
          Store/homebrew.elf
          Store/remote*.md5

  publish:
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine store version
      id: version
      run: |
        major=$(grep -oP '#define\s+VERSION_MAJOR\s+\K[0-9]+' Store/include/defines.h)
        minor=$(grep -oP '#define\s+VERSION_MINOR\s+\K[0-9]+' Store/include/defines.h)
        echo "tag=${major}.${minor}" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Organize release files
      run: |
        mkdir -p release-files
        
        # PS4 files
        cp release-artifacts/PS4-Store-ps4-PKG/Store-R2.pkg release-files/Store-R2-PS4.pkg 2>/dev/null || true
        cp release-artifacts/PS4-Store-ps4-PKG/remote.md5 release-files/remote-PS4.md5 2>/dev/null || true
        cp release-artifacts/PS4-Store-ps4-PKG/homebrew.elf release-files/homebrew-PS4.elf 2>/dev/null || true
        
        # PS5 files
        cp release-artifacts/PS4-Store-ps5-PKG/Store-R2-PS5.pkg release-files/ 2>/dev/null || true
        cp release-artifacts/PS4-Store-ps5-PKG/remote-PS5.md5 release-files/ 2>/dev/null || true
        cp release-artifacts/PS4-Store-ps5-PKG/homebrew.elf release-files/homebrew-PS5.elf 2>/dev/null || true
        
        ls -lah release-files/

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Store ${{ steps.version.outputs.tag }} (PS4 & PS5)
        prerelease: false
        files: release-files/*
