name: Build PS4 & PS5 Store

on:
  push:
    branches: [ master, main]
  pull_request:
    branches: [ master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ps4:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld make

    - name: Setup OpenOrbis Toolchain
      run: |
        curl -sL https://github.com/LightningMods/OpenOrbis-PS4-Toolchain/releases/download/v0.50001/OOSDK.tar.gz \
          | tar -xz -C "$GITHUB_WORKSPACE"
        chmod +x "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/bin/linux/"*
        echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

    - name: Build Store (PS4)
      run: |
        cd Store
        make clean
        make -j$(nproc)
        pkg=$(ls *.pkg 2>/dev/null | head -1)
        if [ -n "$pkg" ] && [ "$pkg" != "Store-R2.pkg" ]; then
          mv "$pkg" Store-R2.pkg
        fi
        test -f Store-R2.pkg || { echo "Error: Store-R2.pkg was not created"; exit 1; }
        test -f homebrew.elf || { echo "Error: homebrew.elf was not created"; exit 1; }
        md5sum homebrew.elf | awk '{print $1}' > remote.md5

    - name: Determine store version
      id: version
      run: |
        major=$(grep -oP '#define\s+VERSION_MAJOR\s+\K[0-9]+' Store/include/defines.h)
        minor=$(grep -oP '#define\s+VERSION_MINOR\s+\K[0-9]+' Store/include/defines.h)
        test -n "$major" || { echo "Error: could not determine VERSION_MAJOR"; exit 1; }
        test -n "$minor" || { echo "Error: could not determine VERSION_MINOR"; exit 1; }
        echo "tag=${major}.${minor}" >> "$GITHUB_OUTPUT"

    - name: Upload PKG artifact (PS4)
      uses: actions/upload-artifact@v4
      with:
        name: PS4-Store-PKG
        path: |
          Store/Store-R2.pkg
          Store/homebrew.elf
          Store/remote.md5

  build-ps5:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld make

    - name: Setup OpenOrbis Toolchain
      run: |
        curl -sL https://github.com/LightningMods/OpenOrbis-PS4-Toolchain/releases/download/v0.50001/OOSDK.tar.gz \
          | tar -xz -C "$GITHUB_WORKSPACE"
        chmod +x "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/bin/linux/"*
        echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

    - name: Build Store (PS5)
      run: |
        cd Store
        make clean
        make -j$(nproc) -f Makefile.ps5
        pkg=$(ls *.pkg 2>/dev/null | head -1)
        if [ -n "$pkg" ] && [ "$pkg" != "Store-R2-PS5.pkg" ]; then
          mv "$pkg" Store-R2-PS5.pkg
        fi
        test -f Store-R2-PS5.pkg || { echo "Error: Store-R2-PS5.pkg was not created"; exit 1; }
        test -f homebrew.elf || { echo "Error: homebrew.elf was not created"; exit 1; }
        md5sum homebrew.elf | awk '{print $1}' > remote-ps5.md5

    - name: Upload PKG artifact (PS5)
      uses: actions/upload-artifact@v4
      with:
        name: PS5-Store-PKG
        path: |
          Store/Store-R2-PS5.pkg
          Store/homebrew.elf
          Store/remote-ps5.md5

  publish:
    needs: [build-ps4, build-ps5]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine store version
      id: version
      run: |
        major=$(grep -oP '#define\s+VERSION_MAJOR\s+\K[0-9]+' Store/include/defines.h)
        minor=$(grep -oP '#define\s+VERSION_MINOR\s+\K[0-9]+' Store/include/defines.h)
        echo "tag=${major}.${minor}" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Store ${{ steps.version.outputs.tag }} (PS4 & PS5)
        prerelease: false
        files: |
          PS4-Store-PKG/Store-R2.pkg
          PS4-Store-PKG/homebrew.elf
          PS4-Store-PKG/remote.md5
          PS5-Store-PKG/Store-R2-PS5.pkg
          PS5-Store-PKG/remote-ps5.md5
